title: Research Wiki
description: Deployment-neutral guides, portable skills, source templates, and MCP patterns for evidence-first research agents.
url: https://kitkitkittt.github.io
baseurl: /research-wiki
public_url: https://research.vnibb.xyz
repository: Kitkitkittt/research-wiki
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
exclude:
  - scripts
  - AGENTS.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
