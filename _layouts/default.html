<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#11130f">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Research Wiki home">
      <span class="brand-mark" aria-hidden="true">R/W</span>
      <span>Research Wiki</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ '/docs/' | relative_url }}">Docs</a>
      <a href="{{ '/guides/' | relative_url }}">Guides</a>
      <a href="{{ '/skills/' | relative_url }}">Skills</a>
      <a href="{{ '/plugins/' | relative_url }}">Plugin</a>
      <a href="https://github.com/Kitkitkittt/research-wiki">GitHub</a>
    </nav>
  </header>
  <main id="content" class="page-shell{% if page.permalink == '/' %} home{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div><strong>Research Wiki</strong><span>Public patterns for grounded research agents.</span></div>
    <div class="footer-links"><a href="{{ '/security/' | relative_url }}">Security</a><a href="{{ '/contributing/' | relative_url }}">Contributing</a><a href="https://github.com/Kitkitkittt/research-wiki">Source</a></div>
  </footer>
</body>
</html>
